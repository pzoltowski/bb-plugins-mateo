<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project badge — variant grid</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: -apple-system, "SF Pro Text", sans-serif; }

  section.theme { padding: 28px 32px 36px; }
  section.dark {
    --bg: #1b1d21; --panel: #202329; --hairline: #2c2f36;
    --ink: #e4e6ea; --ink-soft: #9ba0a8; --ink-subtle: #6f747d;
    --hover: #2a2d34;
    background: var(--bg); color: var(--ink);
  }
  section.light {
    --bg: #f4f5f7; --panel: #ffffff; --hairline: #e0e2e7;
    --ink: #1d2025; --ink-soft: #596069; --ink-subtle: #8b919a;
    --hover: #eceef1;
    background: var(--bg); color: var(--ink);
  }

  h1 { font-size: 14px; font-weight: 600; }
  p.note { color: var(--ink-subtle); font-size: 12px; margin: 4px 0 20px; }

  .variant { margin-top: 18px; }
  .variant > .vhead { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-subtle); margin-bottom: 6px; }
  .variant > .vsub { font-size: 11px; color: var(--ink-subtle); margin-bottom: 8px; }

  /* mini sidebar */
  .sidebar { width: 260px; background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 6px; }
  .pgroup { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px; border-radius: 6px; }
  .pgroup:hover { background: var(--hover); }

  /* the badge under test — 20px tile like size-5 rounded-md */
  .badge {
    width: 20px; height: 20px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid rgba(0,0,0,.15);
    font-weight: 600; text-transform: uppercase; line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .badge.one { font-size: 9px; }
  .badge.two { font-size: 7.5px; letter-spacing: -.02em; }
  .badge img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .badge.iconed { padding: 0; }

  .pname { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .pcount { font-size: 9px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }
  .plus, .chev { width: 12px; height: 12px; color: var(--ink-subtle); flex: none; }
  .chev { width: 10px; height: 10px; transform: rotate(180deg); }

  .callout { font-size: 10px; color: var(--ink-subtle); margin-top: 4px; padding-left: 2px; }
  .callout b { color: var(--ink-soft); font-weight: 600; }
  .same { outline: 1px dashed var(--ink-subtle); outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
</svg>

<section class="theme light">
  <h1>Dockside project badge — variant grid · light</h1>
  <p class="note">Real derivation + hash code runs below: colors are the exact palette picks the build will make. “taskboard” and “Task Analytics” both render <b>TA</b> — same letters, same color.</p>
  <div id="variants-light"></div>
</section>

<section class="theme dark">
  <h1>Dockside project badge — variant grid · dark</h1>
  <p class="note">Same matrix, dark theme.</p>
  <div id="variants-dark"></div>
</section>

<script>
// --- the real algorithm under review -------------------------------------
const PALETTE = ["#2563EB","#7C3AED","#C026D3","#DB2777","#DC2626","#EA580C",
                 "#CA8A04","#16A34A","#059669","#0891B2","#0284C7","#4F46E5"];

function badgeLetters(name, count) {
  const tokens = name.split(/[^A-Za-z0-9]+/).filter(t => t.length > 0);
  if (count === 1) {
    return (tokens[0]?.charAt(0) ?? "?").toUpperCase();
  }
  if (tokens.length >= 2) {
    return (tokens[0].charAt(0) + tokens[1].charAt(0)).toUpperCase();
  }
  const word = tokens[0] ?? "";
  const chars = word.replace(/[^A-Za-z0-9]/g, "");
  return (chars.slice(0, 2).padEnd(2, "?")).toUpperCase();
}

function autoColor(letters) {
  let hash = 0x811c9dc5;
  for (let i = 0; i < letters.length; i++) {
    hash ^= letters.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return PALETTE[(hash >>> 0) % PALETTE.length];
}

function luminance(hex) {
  const ch = [1, 3, 5].map(o => parseInt(hex.slice(o, o + 2), 16) / 255);
  const [r, g, b] = ch.map(c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function fg(bg) {
  const l = luminance(bg);
  const black = (l + 0.05) / 0.05, white = 1.05 / (l + 0.05);
  return black >= white ? "#000000" : "#FFFFFF";
}
// --------------------------------------------------------------------------

const FAVICON = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
  '<rect width="32" height="32" rx="7" fill="#F97316"/>' +
  '<path d="M17.5 4 8 18h6l-1.5 10L23 13h-6l.5-9z" fill="#fff"/></svg>');

const PROJECTS = [
  { name: "bb-plugins-mateo", count: 4, icon: null },
  { name: "taskboard",        count: 3, icon: null, pair: true },
  { name: "Task Analytics",   count: 1, icon: null, pair: true },
  { name: "Paseo",            count: 6, icon: "favicon" },
  { name: "agentum",          count: 2, icon: null },
];

const PLUS = '<svg class="plus"><use href="#plus"/></svg>';
const CHEV = '<svg class="chev"><use href="#chev"/></svg>';

function badgeHtml(project, mode) {
  if (mode.icon && project.icon) {
    return '<span class="badge iconed"><img src="' + FAVICON + '" alt=""></span>';
  }
  const letters = badgeLetters(project.name, mode.letters);
  const bg = autoColor(letters);
  return '<span class="badge ' + (mode.letters === 1 ? "one" : "two") +
    '" style="background:' + bg + ';color:' + fg(bg) + '">' + letters + "</span>";
}

function sidebar(mode, tagPairs) {
  const rows = PROJECTS.map(p => {
    const mark = tagPairs && p.pair ? " same" : "";
    return '<div class="pgroup' + mark + '">' + badgeHtml(p, mode) +
      '<span class="pname">' + p.name + '</span>' +
      '<span class="pcount">' + p.count + "</span>" + PLUS + CHEV + "</div>";
  }).join("");
  const note = tagPairs
    ? '<div class="callout"><b>taskboard</b> and <b>Task Analytics</b> both hash <b>TA</b> → identical badge.</div>'
    : "";
  return '<div><div class="sidebar">' + rows + "</div>" + note + "</div>";
}

const VARIANTS = [
  { head: "before · current", sub: "one letter, color keyed on project id",
    mode: { letters: 1, icon: false } },
  { head: "proposed default · two letters", sub: "initials for multi-word names, first two chars otherwise — color keyed on the letters",
    mode: { letters: 2, icon: false }, tagPairs: true },
  { head: "prefer project icon · on", sub: "Paseo repo ships a favicon → image wins; others keep letters",
    mode: { letters: 2, icon: true } },
  { head: "prefer project icon · off", sub: "setting off → letters everywhere, even where a favicon exists",
    mode: { letters: 2, icon: false } },
];

for (const hostId of ["variants-light", "variants-dark"]) {
  const host = document.getElementById(hostId);
  for (const v of VARIANTS) {
    host.insertAdjacentHTML("beforeend",
      '<div class="variant"><div class="vhead">' + v.head + '</div>' +
      '<div class="vsub">' + v.sub + "</div>" +
      sidebar(v.mode, v.tagPairs) + "</div>");
  }
}
</script>
</body>
</html>
